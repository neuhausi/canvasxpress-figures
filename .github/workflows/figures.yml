# Regenerate every figure from its spec on a clean checkout, verify the bytes against the
# committed manifest, and build the paper. Uses the pinned cxplot image.
name: figures
on: [push, pull_request, workflow_dispatch]
jobs:
  rebuild:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/neuhausi/cxplot:70.2
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate + verify (the Snakemake DAG)
        run: |
          apt-get update -q && apt-get install -y -q python3-pip >/dev/null   # the cxplot image ships python3 but not pip
          pip install -q "snakemake<8" "pulp<2.8"   # python 3.10 in the image; snakemake 7 needs pulp<2.8
          snakemake -s snakemake/Snakefile --cores 2
      - name: Build the paper
        run: |
          V=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep -o '"tag_name": *"v[0-9.]*"' | grep -o '[0-9][0-9.]*')
          curl -sL "https://github.com/quarto-dev/quarto-cli/releases/download/v$V/quarto-$V-linux-amd64.deb" -o q.deb && apt-get install -y -q ./q.deb >/dev/null
          quarto render quarto/
      - uses: actions/upload-artifact@v4
        with:
          name: figures-and-paper
          path: out/
